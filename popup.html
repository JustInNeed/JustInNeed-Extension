<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>JustInNeed</title>
<!--
  popup.html — 참가자용 기록 제어 (확장 아이콘 클릭)
  색 · 모양은 consent.html 과 같은 값을 쓴다 (빌드 단계가 없어 CSS 를 공유하지 않는다).
  동작은 popup.js. 파일 내보내기는 여기서 하지 않고 참여 정보 페이지(탭)에서 한다 —
  팝업은 저장 창이 뜨면 닫히고, 닫히면 blob URL 이 사라져 다운로드가 실패할 수 있다.
-->
<style>
  :root {
    --line: #e4e7e2; --ink: #1e211f; --sub: #6a706b; --faint: #9aa09b;
    --green: #4caf3f; --green-ink: #3b7f2d; --green-tint: #eef7e9; --green-line: #cfe6c2;
    --red-ink: #c0392b; --red-line: #f0cdc8; --red-tint: #fdf3f2;
    --radius-card: 14px; --radius-ctl: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 320px; padding: 16px; background: #f8f9f7; color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand b { display: block; font-size: 15px; }
  .brand small { display: block; color: var(--sub); font-size: 11.5px; line-height: 1.2; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px; }
  .card p { margin: 0 0 12px; color: var(--sub); }
  #loading p { margin: 0; }

  .head { display: flex; justify-content: space-between; align-items: center; }
  .head span { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c7ccc6; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 4px var(--green-tint); }
  .state { font-size: 17px; font-weight: 700; margin-top: 6px; }
  .meta { color: var(--sub); font-size: 13px; min-height: 20px; font-variant-numeric: tabular-nums; }

  label.q { display: block; margin-top: 12px; }
  label.q span { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  input[type=text] {
    width: 100%; font: inherit; color: var(--ink); padding: 8px 10px;
    border: 1px solid var(--line); border-radius: var(--radius-ctl); background: #fff;
  }
  input[type=text]:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
  .qshow { margin-top: 10px; font-size: 13px; color: var(--sub); }
  .qshow b { color: var(--ink); font-weight: 600; }

  button {
    font: inherit; font-weight: 600; cursor: pointer; width: 100%;
    padding: 10px 14px; border-radius: var(--radius-ctl);
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button:focus-visible { outline: 3px solid var(--green-line); outline-offset: 2px; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.armed { background: var(--red-ink); border-color: var(--red-ink); color: #fff; }
  button:disabled { color: var(--faint); background: #fff; border-color: var(--line); cursor: not-allowed; }
  #btn-rec { margin-top: 14px; }
  .stop-mark { display: inline-block; width: 9px; height: 9px; background: currentColor; border-radius: 2px; margin-right: 8px; vertical-align: 1px; }

  .warn { margin-top: 8px; font-size: 12.5px; color: #7a5b0c; }

  .foot { display: flex; gap: 8px; margin-top: 10px; }
  .foot button { font-weight: 500; font-size: 13px; padding: 8px 10px; }
  .who { margin-top: 12px; font-size: 12.5px; color: var(--sub); display: flex; justify-content: space-between; }
  .who b { color: var(--ink); letter-spacing: 0.03em; }

  .banner {
    margin-bottom: 12px; padding: 10px 12px; border-radius: var(--radius-ctl); font-size: 13px;
    background: var(--red-tint); border: 1px solid var(--red-line); color: var(--red-ink); word-break: break-all;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 44 44" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#78c957"/><stop offset="1" stop-color="#4caf3f"/></linearGradient></defs>
      <rect width="44" height="44" rx="12" fill="url(#g)"/>
      <path d="M22 33V21" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M22 22c0-5 3.4-8.4 8.6-8.4 0 5.2-3.6 8.4-8.6 8.4Z" fill="#fff"/>
      <path d="M22 24.5c-4.2 0-7.2-2.8-7.2-7 4.4 0 7.2 2.9 7.2 7Z" fill="#fff" opacity=".85"/>
    </svg>
    <div><b>JustInNeed</b><small>읽기 행동 수집 테스트</small></div>
  </div>

  <div id="msg" class="banner" role="alert" hidden></div>

  <!-- popup.js 가 첫 status 를 그리면 숨긴다. 이 문구가 남아 있으면 스크립트가 안 뜬 것 -->
  <div id="loading" class="card"><p>불러오는 중…</p></div>

  <!-- 동의 없음 / 안내 변경 -->
  <section id="v-consent" class="card" hidden>
    <p id="consent-text">기록을 시작하려면 먼저 테스트 참여에 동의해야 합니다.</p>
    <button class="primary" id="btn-consent" type="button">동의 페이지 열기</button>
  </section>

  <!-- 참여 중 -->
  <section id="v-joined" hidden>
    <div class="card">
      <div class="head"><i class="dot" id="dot"></i><span id="elapsed"></span></div>
      <div class="state" id="state">기록 대기</div>
      <div class="meta" id="meta"></div>

      <label class="q" id="q-edit">
        <span>검색어 (선택)</span>
        <input type="text" id="q" maxlength="80" autocomplete="off" placeholder="이번에 찾아보려는 주제">
      </label>
      <div class="qshow" id="q-show" hidden>검색어 <b id="q-val"></b></div>

      <button id="btn-rec" type="button">기록 시작</button>
      <div class="warn" id="warn" hidden></div>
    </div>

    <div class="foot">
      <button id="btn-export" type="button">파일로 내보내기</button>
      <button id="btn-info" type="button">참여 정보</button>
    </div>
    <div class="who"><span>참여 번호</span><b id="tid"></b></div>
  </section>

<script src="popup.js"></script>
</body>
</html>
